# Nginx конфигурация для прокси-сервера Receipt Splitter
# Путь на сервере: /etc/nginx/sites-available/receipt-proxy

server {
    listen 80;
    server_name api.testagentn8n.ru;

    # Редирект HTTP -> HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.testagentn8n.ru;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.testagentn8n.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.testagentn8n.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Логи
    access_log /var/log/nginx/receipt-proxy-access.log;
    error_log /var/log/nginx/receipt-proxy-error.log;

    # Прокси к Node.js приложению на порту 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # Заголовки для прокси
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ВАЖНО: CORS заголовки НЕ добавляем здесь!
        # Они добавляются в Node.js приложении (proxy-server.js)
        # Иначе будет дублирование и ошибка CORS
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
